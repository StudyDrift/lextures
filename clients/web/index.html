<!doctype html>
<html lang="en" style="overflow:hidden;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lextures" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="description"
    content="Lextures is a learning workspace for courses: deadlines, modules, feedback, and grading together in one place." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap"
    rel="stylesheet" />
  <script>
    ; (() => {
      /* UX.1 — apply data-theme before first paint (no FOUC). */
      try {
        const key = 'lextures.uiTheme'
        const base = (localStorage.getItem(key) || '').trim().toLowerCase() === 'dark' ? 'dark' : 'light'
        let hc = false
        try {
          hc = localStorage.getItem('lextures.highContrast') === '1'
        } catch { /* ignore */ }
        try {
          if (!hc && window.matchMedia && window.matchMedia('(prefers-contrast: more)').matches) {
            hc = true
          }
        } catch { /* ignore */ }
        const theme = hc
          ? (base === 'dark' ? 'high-contrast-dark' : 'high-contrast-light')
          : base
        const root = document.documentElement
        root.setAttribute('data-theme', theme)
        const isDark = theme === 'dark' || theme === 'high-contrast-dark'
        root.classList.toggle('dark', isDark)
        root.classList.toggle('high-contrast', hc)
        root.style.colorScheme = isDark ? 'dark' : 'light'
      } catch {
        document.documentElement.setAttribute('data-theme', 'light')
        document.documentElement.classList.remove('dark')
        document.documentElement.style.colorScheme = 'light'
      }
      try {
        const densityKey = 'lextures.uiDensity'
        const density = (localStorage.getItem(densityKey) || '').trim().toLowerCase()
        document.documentElement.dataset.lmsDensity = density === 'compact' ? 'compact' : 'comfortable'
      } catch {
        document.documentElement.dataset.lmsDensity = 'comfortable'
      }
      try {
        const tintKey = 'lextures.uiSurfaceTint'
        const allowed = new Set(['neutral', 'blue', 'slate', 'red', 'green', 'purple', 'amber', 'teal'])
        const tint = (localStorage.getItem(tintKey) || 'neutral').trim().toLowerCase()
        document.documentElement.dataset.surfaceTint = allowed.has(tint) ? tint : 'neutral'
      } catch {
        document.documentElement.dataset.surfaceTint = 'neutral'
      }
      try {
        const rtlLocales = new Set(['ar', 'he', 'fa', 'ur', 'ps'])
        const localeRaw = (localStorage.getItem('lextures.locale') || 'en').trim().toLowerCase()
        const primary = localeRaw.split(/[-_]/)[0] || 'en'
        const rtlOn = localStorage.getItem('lextures.rtlEnabled') === '1'
        document.documentElement.lang = primary
        document.documentElement.dir = rtlOn && rtlLocales.has(primary) ? 'rtl' : 'ltr'
      } catch {
        document.documentElement.lang = 'en'
        document.documentElement.dir = 'ltr'
      }
      try {
        if (localStorage.getItem('lextures.reduceMotion') === '1') {
          document.documentElement.classList.add('reduced-motion')
        }
      } catch {
        /* ignore */
      }
      try {
        const uiMode = (localStorage.getItem('lextures.uiMode') || '').trim()
        if (uiMode === 'k2') {
          document.documentElement.classList.add('ui-mode-k2')
        } else if (uiMode === 'elementary') {
          document.documentElement.classList.add('ui-mode-elementary')
        }
      } catch {
        /* ignore */
      }
    })()
  </script>
  <title>Lextures</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
