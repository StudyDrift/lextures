<h2 id="what-is-safe-content" tabindex="-1">What is safe content?</h2>
<aside class="content-card content-takeaways" aria-labelledby="key-takeaways-0"><h2 id="key-takeaways-0">Key takeaways</h2><ul>
<li>Markdown is sanitized.</li>
<li>Directives are allowlisted.</li>
<li>Links remain accessible.</li>
</ul>
</aside>
<section class="content-card content-answer" aria-label="Direct answer"><p>Safe content uses Markdown and a small allowlist of documented directives.</p>
</section>
<aside class="content-callout content-callout-warning"><strong>Warning</strong><p>Never add raw HTML.</p>
</aside>
