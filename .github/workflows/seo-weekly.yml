name: Weekly SEO governance

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-and-lifecycle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
      - name: Exhaustive live verification
        run: npm run seo:smoke -- --origin=https://lextures.com --exhaustive
